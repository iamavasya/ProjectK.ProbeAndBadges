name: Publish Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      NUGET_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
      NUGET_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN != '' && secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          source-url: ${{ env.NUGET_SOURCE }}

      - name: Restore
        run: dotnet restore ./ProjectK.ProbeAndBadges.slnx

      - name: Test
        run: dotnet test ./tests/ProjectK.ProbeAndBadges.UnitTests/ProjectK.ProbeAndBadges.UnitTests.csproj --configuration Release --verbosity normal

      - name: Extract version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        id: tag_version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pack (from tag version)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          dotnet pack ./src/ProjectK.ProbeAndBadges.Abstractions/ProjectK.ProbeAndBadges.Abstractions.csproj --configuration Release --output ./artifacts /p:PackageVersion=${{ steps.tag_version.outputs.value }}
          dotnet pack ./src/ProjectK.ProbeAndBadges/ProjectK.ProbeAndBadges.csproj --configuration Release --output ./artifacts /p:PackageVersion=${{ steps.tag_version.outputs.value }}
          dotnet pack ./src/ProjectK.ProbeAndBadges.DependencyInjection/ProjectK.ProbeAndBadges.DependencyInjection.csproj --configuration Release --output ./artifacts /p:PackageVersion=${{ steps.tag_version.outputs.value }}

      - name: Pack (from csproj version)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          dotnet pack ./src/ProjectK.ProbeAndBadges.Abstractions/ProjectK.ProbeAndBadges.Abstractions.csproj --configuration Release --output ./artifacts
          dotnet pack ./src/ProjectK.ProbeAndBadges/ProjectK.ProbeAndBadges.csproj --configuration Release --output ./artifacts
          dotnet pack ./src/ProjectK.ProbeAndBadges.DependencyInjection/ProjectK.ProbeAndBadges.DependencyInjection.csproj --configuration Release --output ./artifacts

      - name: Publish to GitHub Packages
        run: dotnet nuget push "./artifacts/*.nupkg" --source "${{ env.NUGET_SOURCE }}" --api-key "${{ env.NUGET_AUTH_TOKEN }}" --skip-duplicate