<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Probe & Badges ASP.NET Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8f5ef;
      --paper: #fffdf8;
      --ink: #16213e;
      --accent: #c74b50;
      --muted: #687089;
      --line: #e4ddd0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Space Grotesk", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(199,75,80,0.12), transparent 35%),
        radial-gradient(circle at 85% 0%, rgba(22,33,62,0.14), transparent 35%),
        var(--bg);
      color: var(--ink);
    }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 28px 18px 40px;
    }

    .hero {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(22, 33, 62, 0.08);
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.35rem, 3.3vw, 2.2rem);
      letter-spacing: 0.02em;
    }

    .sub {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .hero-links {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .hero-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #efe8da;
      border: 1px solid #ddcfb6;
      color: var(--ink);
      text-decoration: none;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .meta {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--line);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .pill {
      background: #f0ebe0;
      border: 1px solid #e2d8c7;
      border-radius: 999px;
      padding: 5px 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 14px;
    }

    .controls {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 14px;
      display: grid;
      gap: 10px;
    }

    .controls-grid {
      display: grid;
      gap: 10px;
      grid-template-columns: 2fr 1fr 1fr 1fr 120px;
    }

    .controls input,
    .controls select,
    .controls button {
      width: 100%;
      border: 1px solid #d9d0be;
      border-radius: 10px;
      padding: 9px 10px;
      font: inherit;
      background: #fff;
      color: var(--ink);
    }

    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .actions button {
      width: auto;
      cursor: pointer;
      transition: transform 120ms ease;
    }

    .actions button:hover {
      transform: translateY(-1px);
    }

    .primary {
      background: var(--ink) !important;
      color: #fff !important;
      border-color: var(--ink) !important;
    }

    .summary {
      font-size: 0.9rem;
      color: var(--muted);
    }

    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      min-height: 260px;
      animation: rise 380ms ease both;
    }

    .img {
      height: 126px;
      border: 1px solid #e6dfd0;
      border-radius: 12px;
      background: linear-gradient(135deg, #f6efe2, #fffaf0);
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .img img {
      width: 88px;
      height: 88px;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.15));
    }

    .missing {
      color: var(--muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .title {
      margin: 10px 0 6px;
      font-size: 0.98rem;
      line-height: 1.3;
      font-weight: 700;
    }

    .meta2 {
      margin-top: auto;
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .details {
      margin-top: 10px;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.86rem;
      font-weight: 700;
    }

    .details:hover {
      text-decoration: underline;
    }

    .pager {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin: 14px 0 4px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .pager button {
      border: 1px solid #d9d0be;
      background: #fff;
      color: var(--ink);
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      font: inherit;
    }

    .pager button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .empty {
      background: var(--paper);
      border: 1px dashed var(--line);
      border-radius: 12px;
      padding: 16px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 860px) {
      .controls-grid {
        grid-template-columns: 1fr;
      }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>Probe & Badges: End-to-End Demo</h1>
      <p class="sub">API + image static mapping + frontend cards. Дані беруться з бібліотеки.</p>
      <div class="hero-links">
        <a class="hero-link" href="/probes.html">Каталог проб</a>
      </div>
      <div class="meta" id="meta"></div>
    </section>

    <section class="controls">
      <div class="controls-grid">
        <input id="text" type="search" placeholder="Пошук: назва, id, країна..." />
        <select id="country"><option value="">Всі країни</option></select>
        <select id="specialization"><option value="">Всі спеціалізації</option></select>
        <select id="status"><option value="">Всі статуси</option></select>
        <select id="level">
          <option value="">Всі рівні</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>
      </div>
      <div class="actions">
        <button class="primary" id="apply">Застосувати</button>
        <button id="reset">Скинути</button>
        <span class="summary" id="summary"></span>
      </div>
    </section>

    <section class="pager">
      <button id="prev">Назад</button>
      <span id="pageInfo"></span>
      <button id="next">Вперед</button>
    </section>

    <section class="grid" id="grid"></section>
  </main>

  <script type="module">
    const state = {
      text: '',
      country: '',
      specialization: '',
      status: '',
      level: '',
      skip: 0,
      take: 24,
      total: 0
    };

    async function boot() {
      const [metaRes, filtersRes] = await Promise.all([
        fetch('/api/meta'),
        fetch('/api/filter-options')
      ]);

      const meta = await metaRes.json();
      const filters = await filtersRes.json();

      renderMeta(meta);
      renderFilters(filters);
      bindEvents();
      await loadResults();
    }

    function renderMeta(meta) {
      const el = document.getElementById('meta');
      const p = meta.metadata || {};
      const s = meta.assetsSnapshot || {};

      const rows = [
        `ParserVersion: ${p.parserVersion || '-'}`,
        `Total: ${p.totalBadges ?? '-'}`,
        `HasAssets: ${meta.hasAssets}`,
        `ImagesCount: ${s.imagesCount ?? '-'}`,
        `ExtractedAt: ${s.extractedAtUtc || '-'}`
      ];

      el.innerHTML = rows.map(x => `<span class="pill">${x}</span>`).join('');
    }

    function renderFilters(filters) {
      fillSelect('country', filters.countries || [], 'Всі країни');
      fillSelect('specialization', filters.specializations || [], 'Всі спеціалізації');
      fillSelect('status', filters.statuses || [], 'Всі статуси');
      fillSelect('level', (filters.levels || []).map(String), 'Всі рівні');
    }

    function fillSelect(id, values, defaultLabel) {
      const select = document.getElementById(id);
      select.innerHTML = `<option value="">${defaultLabel}</option>` +
        values.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('');
    }

    function bindEvents() {
      document.getElementById('apply').addEventListener('click', async () => {
        syncStateFromControls();
        state.skip = 0;
        await loadResults();
      });

      document.getElementById('reset').addEventListener('click', async () => {
        state.text = '';
        state.country = '';
        state.specialization = '';
        state.status = '';
        state.level = '';
        state.skip = 0;
        syncControlsFromState();
        await loadResults();
      });

      document.getElementById('text').addEventListener('keydown', async (event) => {
        if (event.key !== 'Enter') return;
        syncStateFromControls();
        state.skip = 0;
        await loadResults();
      });

      document.getElementById('prev').addEventListener('click', async () => {
        state.skip = Math.max(0, state.skip - state.take);
        await loadResults();
      });

      document.getElementById('next').addEventListener('click', async () => {
        if (state.skip + state.take >= state.total) return;
        state.skip += state.take;
        await loadResults();
      });
    }

    function syncStateFromControls() {
      state.text = document.getElementById('text').value.trim();
      state.country = document.getElementById('country').value;
      state.specialization = document.getElementById('specialization').value;
      state.status = document.getElementById('status').value;
      state.level = document.getElementById('level').value;
    }

    function syncControlsFromState() {
      document.getElementById('text').value = state.text;
      document.getElementById('country').value = state.country;
      document.getElementById('specialization').value = state.specialization;
      document.getElementById('status').value = state.status;
      document.getElementById('level').value = state.level;
    }

    async function loadResults() {
      const params = new URLSearchParams();
      if (state.text) params.set('text', state.text);
      if (state.country) params.set('country', state.country);
      if (state.specialization) params.set('specialization', state.specialization);
      if (state.status) params.set('status', state.status);
      if (state.level) params.set('level', state.level);
      params.set('skip', String(state.skip));
      params.set('take', String(state.take));

      const res = await fetch(`/api/search?${params.toString()}`);
      const data = await res.json();

      state.total = data.total || 0;
      renderBadges(data.items || []);
      renderSummary();
      renderPager();
    }

    function renderSummary() {
      const from = state.total === 0 ? 0 : state.skip + 1;
      const to = Math.min(state.total, state.skip + state.take);
      document.getElementById('summary').textContent =
        `Знайдено: ${state.total}. Показано: ${from}-${to}`;
    }

    function renderPager() {
      const page = Math.floor(state.skip / state.take) + 1;
      const pages = Math.max(1, Math.ceil(state.total / state.take));

      document.getElementById('pageInfo').textContent = `Сторінка ${page} з ${pages}`;
      document.getElementById('prev').disabled = state.skip === 0;
      document.getElementById('next').disabled = state.skip + state.take >= state.total;
    }

    function renderBadges(items) {
      const grid = document.getElementById('grid');
      if (!items.length) {
        grid.innerHTML = '<div class="empty">Нічого не знайдено за цими фільтрами.</div>';
        return;
      }

      grid.innerHTML = items.map((b, i) => {
        const hasImg = !!b.imagePath;
        const image = hasImg
          ? `<img src="${b.imagePath}" alt="${escapeHtml(b.title)}" loading="lazy" />`
          : `<span class="missing">no image</span>`;

        return `
          <article class="card" style="animation-delay:${(i * 20)}ms">
            <div class="img">${image}</div>
            <h3 class="title">${escapeHtml(b.title)}</h3>
            <div class="meta2">
              <span>ID: ${escapeHtml(b.id)}</span>
              <span>${escapeHtml(b.country)} · ${escapeHtml(b.status)}</span>
              <span>Level: ${b.level ?? '-'}</span>
            </div>
            <a class="details" href="/badge.html?id=${encodeURIComponent(b.id)}">Детальний опис</a>
          </article>
        `;
      }).join('');
    }

    function escapeHtml(value) {
      return String(value || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    try {
      await boot();
    } catch (err) {
      console.error(err);
      document.body.innerHTML = `<pre style="padding:16px;color:#8b1f26">${escapeHtml(err?.stack || err?.message || String(err))}</pre>`;
    }
  </script>
</body>
</html>
